<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Billiards Bar Cafe</title>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./app/app.css" />
</head>

<body>
  <div id="bbc-nav"></div>

  <main class="page">
    <div class="wrap-sm">
      <div class="page-head">
        <h1>Welcome Back</h1>
        <div class="bar"></div>
        <p>Sign in to place orders, reserve a snooker table and see your booking history.</p>
      </div>

      <form class="panel" id="form" novalidate>
        <div class="field" id="f-email">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
          <div class="err">Enter a valid email address.</div>
        </div>

        <div class="field" id="f-pwd">
          <label for="pwd">Password</label>
          <input type="password" id="pwd" placeholder="Your password" autocomplete="current-password" />
          <div class="err">Password is required.</div>
        </div>

        <div id="form-err" class="err" style="display:none;margin-bottom:12px"></div>

        <button class="btn btn-primary btn-block" type="submit">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>

        <p class="center small muted mt-6">
          New to BBC? <a class="link-y" id="reg-link" href="./register.html">Create an account</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="bbc-foot">
    <div class="wrap">Billiards Bar Cafe, Vijay Nagar &middot; <a href="./index.html">Home</a></div>
  </footer>

  <script src="./app/data.js"></script>
  <script src="./app/app.js"></script>
  <script>
    (function () {
      'use strict';
      BBC.init('account');

      /* Where to go after a successful sign in. Restricted to same-site pages
         so a crafted ?next= cannot bounce visitors off to another host. */
      var next = new URLSearchParams(location.search).get('next') || 'account.html';
      if (/^[a-zA-Z]+:|^\/\//.test(next)) next = 'account.html';
      document.getElementById('reg-link').href = './register.html?next=' + encodeURIComponent(next);

      if (BBC.auth.current()) location.replace('./' + next);

      function mark(id, bad) {
        document.getElementById(id).classList.toggle('invalid', bad);
        return !bad;
      }

      document.getElementById('form').addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById('email').value.trim();
        var pwd = document.getElementById('pwd').value;
        var box = document.getElementById('form-err');
        box.style.display = 'none';

        var ok = mark('f-email', !/^\S+@\S+\.\S+$/.test(email));
        ok = mark('f-pwd', pwd.length === 0) && ok;
        if (!ok) return;

        var res = BBC.auth.login(email, pwd);
        if (!res.ok) {
          box.textContent = res.error;
          box.style.display = 'block';
          return;
        }
        BBC.toast('Welcome back, ' + res.user.name.split(' ')[0] + '!');
        setTimeout(function () { location.href = './' + next; }, 350);
      });
    })();
  </script>
</body>

</html>
