<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmed | Billiards Bar Cafe</title>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./app/app.css" />
</head>

<body>
  <div id="bbc-nav"></div>

  <main class="page">
    <div class="wrap">
      <div class="steps">
        <span class="step done"><b>1</b> Cart</span><span class="sep"></span>
        <span class="step done"><b>2</b> Details</span><span class="sep"></span>
        <span class="step done"><b>3</b> Payment</span><span class="sep"></span>
        <span class="step done"><b>4</b> Done</span>
      </div>

      <div class="panel" style="max-width:620px;margin:0 auto;text-align:center" id="box">
        <div class="tick"><i class="fa-solid fa-check"></i></div>
        <h1 style="font-family:'Style Script',cursive;color:#ffff00;font-size:2.4rem;font-weight:500"
          id="title">Thank You!</h1>
        <p class="muted small" id="sub" style="margin-bottom:22px"></p>

        <div class="receipt" id="receipt"></div>

        <div class="mt-6">
          <a class="btn btn-primary" href="./account.html">View in My Account</a>
          <a class="btn" href="./menu.html">Order more</a>
        </div>
        <p class="small muted mt-6">
          Reference kept in this browser. Show the booking ID at the counter when you arrive.
        </p>
      </div>
    </div>
  </main>

  <footer class="bbc-foot">
    <div class="wrap">Billiards Bar Cafe, Vijay Nagar &middot; <a href="./index.html">Home</a></div>
  </footer>

  <script src="./app/data.js"></script>
  <script src="./app/app.js"></script>
  <script>
    (function () {
      'use strict';
      BBC.init('account');

      var id = new URLSearchParams(location.search).get('id');
      var rec = id ? BBC.records.find(id) : null;
      var box = document.getElementById('box');

      if (!rec) {
        box.innerHTML = '<div class="empty-state"><i class="fa-solid fa-circle-question"></i>' +
          'We could not find that reference.' +
          '<div class="mt-4"><a class="btn btn-primary" href="./account.html">My Account</a></div></div>';
        return;
      }

      function row(k, v) {
        return '<div class="rline"><span>' + k + '</span><span>' + v + '</span></div>';
      }

      var paid = rec.payment.status === 'paid';
      var html = '';

      if (rec.kind === 'booking') {
        document.getElementById('title').textContent = 'Seat Booked!';
        document.getElementById('sub').textContent =
          'Table ' + rec.seats.join(', ') + ' is reserved for you on ' +
          BBC.prettyDate(rec.date) + ' at ' + rec.slot + '.';
        html += row('Booking ID', '<b style="color:#ffff00">' + BBC.esc(rec.id) + '</b>');
        html += row('Tables', BBC.esc(rec.seats.join(', ')));
        html += row('Area', BBC.esc(rec.zones.join(', ')));
        html += row('Date &amp; time', BBC.prettyDate(rec.date) + ', ' + BBC.esc(rec.slot));
        html += row('Duration', rec.hours + ' hour' + (rec.hours > 1 ? 's' : ''));
        html += row('Guests', rec.guests);
      } else {
        document.getElementById('title').textContent = 'Order Placed!';
        document.getElementById('sub').textContent =
          rec.orderType === 'delivery'
            ? 'Your food is being prepared and will be on its way shortly.'
            : 'Your food is being prepared. See you at BBC!';
        html += row('Order ID', '<b style="color:#ffff00">' + BBC.esc(rec.id) + '</b>');
        html += row('Type', BBC.esc(rec.orderType.replace('-', ' ')));
        rec.items.forEach(function (i) {
          html += row(BBC.esc(i.name) + ' &times; ' + i.qty, BBC.money(i.price * i.qty));
        });
        if (rec.orderType === 'delivery') html += row('Deliver to', BBC.esc(rec.customer.address));
        if (rec.orderType === 'dine-in') html += row('Arriving at', BBC.esc(rec.customer.arrival));
      }

      html += row('Payment', BBC.esc(rec.payment.label));
      html += row('Status', paid
        ? '<span class="badge paid">PAID</span>'
        : '<span class="badge confirmed">PAY AT COUNTER</span>');
      html += row('Reference', BBC.esc(rec.payment.reference));
      html += row('Placed on', BBC.prettyDateTime(rec.createdAt));
      html += '<div class="summary-total"><span>Total</span><span>' +
        BBC.money(rec.amounts.total) + '</span></div>';

      document.getElementById('receipt').innerHTML = html;
    })();
  </script>
</body>

</html>
